name: "Release"

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., 0.20.0 or 0.20.0-rc1)'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      commit: ${{ steps.version.outputs.commit }}
      native: ${{ steps.version.outputs.native }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0

    - name: Resolve existing tag and source version
      id: version
      env:
        REQUEST_TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        python3 - <<'PYTHON'
        import os,re,subprocess
        from pathlib import Path
        version=os.environ['REQUEST_TAG']
        if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-(?:rc|alpha|beta)[0-9]+)?',version): raise SystemExit('invalid version tag')
        commit=subprocess.check_output(['git','rev-parse','--verify','refs/tags/'+version+'^{commit}'],text=True).strip()
        subprocess.run(['git','checkout','--detach',commit],check=True)
        subprocess.run(['bash','scripts/validate-version.sh',version],check=True)
        native='true' if 'libhttpserver_v3core_la_SOURCES' in Path('src/Makefile.am').read_text() else 'false'
        with open(os.environ['GITHUB_OUTPUT'],'a') as out:
            out.write('version='+version+'\ncommit='+commit+'\nnative='+native+'\nis_prerelease='+str('-' in version).lower()+'\n')
        PYTHON

    - name: Extract release notes
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        chmod +x scripts/extract-release-notes.sh
        scripts/extract-release-notes.sh "$VERSION" > release-notes.md
        echo "--- Release notes ---"
        cat release-notes.md

    - name: Upload release notes
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-notes
        path: release-notes.md

  build-dist:
    name: Build distribution tarball
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.native == 'false'
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ needs.validate.outputs.commit }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake libtool libcurl4-openssl-dev

    - name: Build libhttpserver
      run: |
        ./bootstrap
        mkdir build
        cd build
        ../configure
        make
        make check

    - name: Create distribution tarball
      run: |
        cd build
        make dist

    - name: Upload tarball
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: dist-tarball
        path: build/libhttpserver-*.tar.gz

  verify-dist-linux:
    name: Verify tarball (Linux)
    runs-on: ubuntu-latest
    needs: build-dist
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev

    - name: Download tarball
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: dist-tarball

    - name: Build and test from tarball
      run: |
        tar -xzf libhttpserver-*.tar.gz
        cd libhttpserver-*/
        mkdir build
        cd build
        ../configure
        make
        make check

    - name: Print test results on failure
      if: failure()
      run: |
        cd libhttpserver-*/build
        cat test/test-suite.log || true

  verify-dist-macos:
    name: Verify tarball (macOS)
    runs-on: macos-latest
    needs: build-dist
    steps:
    - name: Install build tools
      run: brew install autoconf automake libtool

    - name: Fetch curl from cache
      id: cache-curl
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: curl-7.75.0
        key: macos-latest-CURL-pre-built-v3

    - name: Build curl (if not cached)
      if: steps.cache-curl.outputs.cache-hit != 'true'
      run: |
        curl https://libhttpserver.s3.amazonaws.com/travis_stuff/curl-7.75.0.tar.gz -o curl-7.75.0.tar.gz
        tar -xzf curl-7.75.0.tar.gz
        cd curl-7.75.0
        ./configure --with-darwinssl --without-ssl --without-nghttp2 --without-libidn2 --without-libssh2 --without-brotli --without-zstd --without-librtmp --without-libpsl --disable-ldap --disable-ldaps
        make

    - name: Install curl
      run: |
        cd curl-7.75.0
        sudo make install

    - name: Download tarball
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: dist-tarball

    - name: Build and test from tarball
      run: |
        tar -xzf libhttpserver-*.tar.gz
        cd libhttpserver-*/
        mkdir build
        cd build
        CFLAGS='-mtune=generic' ../configure --disable-fastopen
        make
        make check

    - name: Print test results on failure
      if: failure()
      run: |
        cd libhttpserver-*/build
        cat test/test-suite.log || true

  verify-dist-windows:
    name: Verify tarball (Windows)
    runs-on: windows-latest
    needs: build-dist
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Setup MSYS2
      uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c
      with:
        msystem: MINGW64
        update: true
        install: >-
          autotools
          base-devel

    - name: Install MinGW64 packages
      run: |
        pacman --noconfirm -S --needed mingw-w64-x86_64-{toolchain,libtool,make,pkg-config,libsystre,doxygen,graphviz,curl,python}

    - name: Download tarball
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: dist-tarball

    - name: Build and test from tarball
      run: |
        tar -xzf libhttpserver-*.tar.gz
        cd libhttpserver-*/
        mkdir build
        cd build
        ../configure --disable-fastopen
        make
        make check

    - name: Print test results on failure
      if: failure()
      run: |
        cd libhttpserver-*/build
        cat test/test-suite.log || true

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, verify-dist-linux, verify-dist-macos, verify-dist-windows]
    if: needs.validate.outputs.native == 'false'
    permissions:
      contents: write
    steps:
    - name: Download tarball
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: dist-tarball

    - name: Download release notes
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: release-notes

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        VERSION: ${{ needs.validate.outputs.version }}
        IS_PRERELEASE: ${{ needs.validate.outputs.is_prerelease }}
      run: |

        PRERELEASE_FLAG=""
        if [ "$IS_PRERELEASE" = "true" ]; then
          PRERELEASE_FLAG="--prerelease"
        fi

        gh release create "$VERSION" \
          --title "libhttpserver $VERSION" \
          --notes-file release-notes.md \
          $PRERELEASE_FLAG \
          libhttpserver-*.tar.gz

  v3-acceptance:
    needs: validate
    if: needs.validate.outputs.native == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/v3-release-acceptance.yml
    with:
      source_commit: ${{ needs.validate.outputs.commit }}
      source_version: ${{ needs.validate.outputs.version }}
      publication: true
