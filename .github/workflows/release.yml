# Temporary diagnostic branch only; this file must never merge into v3.
name: Focused Darwin diagnostics (one authorized batch)
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: Diagnostic sentinel only; creates no tag or release
        required: true
        type: string
permissions:
  contents: read
jobs:
  focused-darwin:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DIAGNOSTIC_SENTINEL: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the single diagnostic request
        run: |
          EVIDENCE="$RUNNER_TEMP/darwin-focused-evidence"
          printf 'EVIDENCE=%s\n' "$EVIDENCE" >> "$GITHUB_ENV"
          mkdir "$EVIDENCE"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/task/FEATURE-ci-darwin-focused-diagnostics
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$DIAGNOSTIC_SENTINEL" = darwin-focused-once-a5a72356
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor a5a72356741300e5da16b94090f0f26a67a2d1f7 HEAD
          git status --porcelain > "$EVIDENCE/checkout-status.txt"
          test ! -s "$EVIDENCE/checkout-status.txt"
          git show --no-patch --format=fuller HEAD > "$EVIDENCE/source-commit.txt"
          git archive --format=tar.gz --output="$EVIDENCE/source.tar.gz" HEAD
          shasum -a 256 "$EVIDENCE/source.tar.gz" > "$EVIDENCE/source.sha256"
          printf 'run=%s attempt=%s sha=%s ref=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_REF" > "$EVIDENCE/request.txt"
      - name: Existing native prerequisites and compiler selection
        run: |
          exec > >(tee "$EVIDENCE/setup.log") 2>&1
          brew install autoconf automake libtool pkg-config python curl llvm make
          bash scripts/ci-macos-toolchain.sh
          sdk_path=${SDKROOT:-$(xcrun --show-sdk-path)}
          printf 'SDKROOT=%s\n' "$sdk_path" >> "$GITHUB_ENV"
          xcrun --find lldb
          xcrun lldb --version
          gmake --version
          sw_vers
          uname -a
          xcodebuild -version
          xcrun --show-sdk-version
      - name: Existing pinned private provider
        run: |
          exec > >(tee "$EVIDENCE/provider-setup.log") 2>&1
          CC="$V3_CC" CXX="$V3_CXX" python3 scripts/prepare-v3-package-ci.py --make gmake --jobs 2 --output "$EVIDENCE/prerequisites"
      - name: Compile and execute only the six selected programs, once each
        run: |
          cat > "$EVIDENCE/focused.py" <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import shlex
          import signal
          import subprocess
          import tarfile
          import time

          root = Path(os.environ['EVIDENCE']).resolve()
          source = root / 'source'
          source.mkdir()
          # git archive is the exact diagnostic commit, not a generated release tarball.
          with tarfile.open(root / 'source.tar.gz') as archive:
              archive.extractall(source, filter='data')
          programs = ['task_resume_signal_lifetime', 'http1_response_outbox', 'http3_qpack',
                      'resource_limits', 'consumer_v3_peer_policy_runtime', 'external_http1_e2e']
          receipt = dict(status='incomplete', release_acceptance=False, source_sha=os.environ['GITHUB_SHA'],
                         archive_sha256=hashlib.sha256((root / 'source.tar.gz').read_bytes()).hexdigest(),
                         run_id=os.environ['GITHUB_RUN_ID'], attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                         platform=platform.platform(), euid=os.geteuid(), selected_programs=programs,
                         differences=['Exact Git source archive bootstrapped here, not the historical generated release archive.',
                                      'Temporary scalar tracing and a single LLDB launch per program perturb scheduling.',
                                      'TLS-no native make targets retain their declared linkage; header uses installed TLS-yes shared library.',
                                      'Pinned OpenSSL 3.5.9 prerequisites built with the currently selected native compiler; original provider build flags were not retained.'],
                         environment={key: os.environ.get(key) for key in ('PATH', 'SDKROOT', 'V3_CXX', 'V3_CC', 'V3_PACKAGE_TOOLCHAIN')},
                         commands=[], cases={name: dict(status='not-executed') for name in programs})

          def save():
              (root / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')


          def command(argv, cwd, env, timeout=1200, required=True):
              row = dict(argv=[str(arg) for arg in argv], cwd=str(cwd), timeout_seconds=timeout,
                         environment={key: env.get(key) for key in ('CC', 'CXX', 'CXXFLAGS', 'CPPFLAGS', 'LDFLAGS', 'SDKROOT',
                                      'V3_TLS_CFLAGS', 'V3_TLS_LIBS', 'DYLD_LIBRARY_PATH', 'LHS_DARWIN_HEADER_TRACE', 'LHS_DARWIN_STORAGE_TRACE')})
              row['log'] = str(root / ('command-%03d.log' % len(receipt['commands'])))
              receipt['commands'].append(row)
              save()
              started = time.monotonic()
              with open(row['log'], 'wb') as log:
                  process = subprocess.Popen(row['argv'], cwd=cwd, env=env, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
                  try:
                      row['exit'] = process.wait(timeout=timeout)
                  except subprocess.TimeoutExpired:
                      row['timed_out'] = True
                      os.killpg(process.pid, signal.SIGTERM)
                      try:
                          process.wait(timeout=3)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          process.wait(timeout=3)
                      row['exit'] = process.returncode
              row['duration_seconds'] = time.monotonic() - started
              save()
              if required and (row['exit'] or row.get('timed_out')):
                  raise RuntimeError('command failed; original log: ' + row['log'])
              return row


          # Invoked inside LLDB for exactly one synchronous launch. No inferior expressions,
          # function calls, signal handlers or assertion interception are installed.
          debug_script = root / 'capture-lldb.py'
          debug_script.write_text('''import json, lldb, os
          from pathlib import Path
          lldb.debugger.SetAsync(False)
          target = lldb.debugger.GetSelectedTarget()
          launch_info = target.GetLaunchInfo()
          launch_info.SetWorkingDirectory(os.environ['LHS_DEBUG_CWD'])
          launch_error = lldb.SBError()
          process = target.Launch(launch_info, launch_error)
          state = process.GetState()
          row = dict(launch_error=str(launch_error) if launch_error.Fail() else None, pid=process.GetProcessID(), state=lldb.SBDebugger.StateAsCString(state),
                     exit=process.GetExitStatus() if state == lldb.eStateExited else None,
                     exit_description=process.GetExitDescription(), threads=[])
          lldb.debugger.HandleCommand('thread backtrace all')
          for thread in process:
              info = dict(thread_id=thread.GetThreadID(), stop_reason=thread.GetStopReason(),
                          stop_description=thread.GetStopDescription(512),
                          stop_data=[thread.GetStopReasonDataAtIndex(i) for i in range(thread.GetStopReasonDataCount())])
              row['threads'].append(info)
              for frame in list(thread)[:32]:
                  path = frame.GetLineEntry().GetFileSpec().GetFilename() or ''
                  if path.endswith(('.cpp', '.hpp')):
                      print('DIAGNOSTIC FRAME', thread.GetThreadID(), frame.GetFrameID(), frame.GetFunctionName(), path)
                      for value in list(frame.GetVariables(True, True, False, True))[:32]:
                          print(str(value)[:2048])
          # A stopped abort remains a failure; end this same inferior after recording it.
          if state != lldb.eStateExited and process.IsValid():
              error = process.Kill()
              row['kill_error'] = str(error) if error.Fail() else None
          Path(os.environ['LHS_DEBUG_RESULT']).write_text(json.dumps(row, indent=2) + '\\n')
          ''')


          def run_case(name, executable, cwd, env):
              case = receipt['cases'][name]
              case.update(status='incomplete', executable=str(executable), cwd=str(cwd), euid=os.geteuid())
              case['executable_sha256'] = hashlib.sha256(executable.read_bytes()).hexdigest()
              result_path = root / (name + '-lldb.json')
              commands = root / (name + '-lldb.txt')
              inferior_environment = ['DYLD_LIBRARY_PATH=' + env['DYLD_LIBRARY_PATH']]
              if env.get('LHS_DARWIN_STORAGE_TRACE'):
                  inferior_environment.append('LHS_DARWIN_STORAGE_TRACE=1')
              if env.get('LHS_DARWIN_HEADER_TRACE'):
                  inferior_environment.append('LHS_DARWIN_HEADER_TRACE=1')
              commands.write_text('settings set target.disable-aslr false\nsettings set target.env-vars ' +
                                  shlex.join(inferior_environment) + '\nscript exec(compile(open(' +
                                  repr(str(debug_script)) + ').read(), ' + repr(str(debug_script)) + ", 'exec'))\n")
              launch_env = dict(env, LHS_DEBUG_RESULT=str(result_path), LHS_DEBUG_CWD=str(cwd))
              # xcrun supplies native Apple LLDB/debugserver; the inferior is the real
              # selected test binary, with no rerun after an assertion, abort or timeout.
              row = command(['xcrun', 'lldb', '--batch', '--source', str(commands), '--', str(executable)],
                            cwd, launch_env, timeout=180, required=False)
              case.update(log=row['log'], debugger_exit=row['exit'], timed_out=row.get('timed_out', False))
              if result_path.is_file():
                  debug = json.loads(result_path.read_text())
                  case['inferior'] = debug
                  case['status'] = ('incomplete' if debug.get('launch_error') else
                                    'passed' if not row['exit'] and not row.get('timed_out') and debug['state'] == 'exited' and debug['exit'] == 0 else 'failed')
              save()


          base_env = dict(os.environ, CC=os.environ['V3_CC'], CXX=os.environ['V3_CXX'], MAKE='gmake',
                          PKG_CONFIG_PATH='', CXXFLAGS='-O0 -g -DLHS_DARWIN_FOCUSED_DIAGNOSTICS')
          provider = root / 'prerequisites/provider'
          base_env['LDFLAGS'] = '-Wl,-rpath,' + str(provider / 'lib')
          base_env['DYLD_LIBRARY_PATH'] = os.pathsep.join([str(provider / 'lib'), os.environ['V3_PACKAGE_TOOLCHAIN'] + '/lib/c++'])
          try:
              save()
              if platform.system() != 'Darwin' or os.geteuid() != 0:
                  raise RuntimeError('requires actual native Darwin and original header EUID 0')
              for argv in ([base_env['CXX'], '--version'], [base_env['CC'], '--version'], ['gmake', '--version'],
                           [str(provider / 'bin/openssl'), 'version', '-a'], ['otool', '-L', str(provider / 'lib/libssl.3.dylib')],
                           ['xcrun', 'lldb', '--version'],
                           ['xcrun', '--show-sdk-path'], ['id']):
                  command(argv, source, base_env, timeout=30)
              command(['bash', './bootstrap'], source, base_env)
              for mode, names in [('no', programs[:5]), ('yes', programs[5:])]:
                  build = root / ('tls-' + mode) / 'build'
                  prefix = build.parent / 'prefix'
                  build.mkdir(parents=True)
                  env = dict(base_env)
                  if mode == 'yes':
                      env.update(V3_TLS_CFLAGS='-I' + str(provider / 'include'),
                                 V3_TLS_LIBS='-L' + str(provider / 'lib') + ' -lssl -lcrypto', LHS_DARWIN_HEADER_TRACE='1')
                  try:
                      command(['bash', str(source / 'configure'), '--enable-v3-tls=' + mode,
                               '--disable-examples', '--prefix=' + str(prefix)], build, env)
                      command(['gmake', '-C', 'src', '-j2'], build, env)
                  except Exception as error:
                      for name in names:
                          receipt['cases'][name].update(status='incomplete', setup_error=str(error))
                      save()
                      continue
                  for name in names:
                      try:
                          if mode == 'no':
                              command(['gmake', '-C', 'test', '-j2', name], build, env)
                              # Libtool wrappers must not be debugged as shell scripts.
                              binary = build / 'test/.libs' / name
                              if not binary.is_file():
                                  binary = build / 'test' / name
                              case_env = dict(env, DYLD_LIBRARY_PATH=os.pathsep.join([str(build / 'src/.libs'), env['DYLD_LIBRARY_PATH']]))
                              if name in ('resource_limits', 'http1_response_outbox'):
                                  case_env['LHS_DARWIN_STORAGE_TRACE'] = '1'
                              receipt['cases'][name].update(tls='no', linkage='native-target-declared', source_context='git-archive')
                          else:
                              command(['gmake', '-C', 'src', 'install'], build, env)
                              consumer = build.parent / 'consumer'
                              consumer.mkdir()
                              binary = consumer / name
                              units = [source / 'test' / unit for unit in ('integ/external_http1_e2e_test.cpp', 'parity/response_frame.cpp', 'parity/normalize.cpp')]
                              flags = ['-std=c++20', '-O0', '-g', '-DLHS_DARWIN_FOCUSED_DIAGNOSTICS', '-DHTTPSERVER_COMPILATION',
                                       '-I' + str(prefix / 'include'), '-I' + str(source / 'src'), '-I' + str(source / 'test')]
                              command(shlex.split(env['CXX']) + flags + [str(unit) for unit in units] +
                                      [str(prefix / 'lib/libhttpserver.dylib'), '-pthread', '-Wl,-rpath,' + str(prefix / 'lib'),
                                       '-Wl,-map,' + str(binary) + '.map', '-MMD', '-o', str(binary)], consumer, env)
                              command(['otool', '-L', str(prefix / 'lib/libhttpserver.dylib')], build, env, timeout=30)
                              case_env = dict(env, DYLD_LIBRARY_PATH=os.pathsep.join([str(prefix / 'lib'), env['DYLD_LIBRARY_PATH']]))
                              receipt['cases'][name].update(tls='yes', linkage='installed-shared', source_context='git-archive-private-integration-headers')
                          command(['file', str(binary)], build, case_env, timeout=30)
                          command(['otool', '-L', str(binary)], build, case_env, timeout=30)
                          run_case(name, binary, build / 'test' if mode == 'no' else source / 'test', case_env)
                      except Exception as error:
                          receipt['cases'][name].update(status='incomplete', error=str(error))
                          save()
              receipt['status'] = 'passed' if all(row['status'] == 'passed' for row in receipt['cases'].values()) else 'failed-or-incomplete'
          except Exception as error:
              receipt['error'] = str(error)
          finally:
              save()
          raise SystemExit(0 if receipt['status'] == 'passed' else 1)
          PYTHON
          # The recurring package failure ran at EUID 0. Keep that context for
          # both lanes, including debugserver's inferior, and record it below.
          sudo env "PATH=$PATH" "SDKROOT=$SDKROOT" "V3_CXX=$V3_CXX" "V3_CC=$V3_CC" "V3_PACKAGE_TOOLCHAIN=$V3_PACKAGE_TOOLCHAIN" \
            "GITHUB_SHA=$GITHUB_SHA" "GITHUB_RUN_ID=$GITHUB_RUN_ID" "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" "EVIDENCE=$EVIDENCE" \
            python3 "$EVIDENCE/focused.py"
      - name: Make privileged logs readable
        if: always()
        run: |
          if [ -d "$EVIDENCE" ]; then sudo chown -R "$(id -u):$(id -g)" "$EVIDENCE"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: darwin-focused-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/darwin-focused-evidence
            ${{ runner.temp }}/v3-toolchain
          retention-days: 14
          if-no-files-found: error
