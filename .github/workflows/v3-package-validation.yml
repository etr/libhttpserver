name: v3 installed package validation
on:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang autoconf automake libtool pkg-config python3 perl libcurl4-openssl-dev binutils
      - name: Build selected prerequisites
        run: python3 scripts/prepare-v3-package-ci.py --output package-evidence/prerequisites
      - name: Bootstrap
        run: ./bootstrap
      - name: Installed matrix
        run: >-
          python3 scripts/check-v3-installed-consumer.py --output package-evidence/matrix
          --provider-prefix "$PWD/package-evidence/prerequisites/provider"
          --pkg-config-dir /usr/lib/x86_64-linux-gnu/pkgconfig --pkg-config-dir /usr/share/pkgconfig
          --compiler clang++ --cc clang --jobs 2
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-package-linux-${{ github.sha }}
          path: package-evidence
          if-no-files-found: error
  macos:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prerequisites
        run: brew install autoconf automake libtool pkg-config python curl
      - name: Build selected prerequisites
        run: python3 scripts/prepare-v3-package-ci.py --output package-evidence/prerequisites
      - name: Bootstrap
        run: ./bootstrap
      - name: Installed matrix
        run: >-
          python3 scripts/check-v3-installed-consumer.py --output package-evidence/matrix
          --provider-prefix "$PWD/package-evidence/prerequisites/provider" --pkg-config-dir "$(brew --prefix)/share/pkgconfig"
          --compiler clang++ --cc clang --jobs 2
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-package-macos-${{ github.sha }}
          path: package-evidence
          if-no-files-found: error
  mingw64:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c
        with:
          msystem: MINGW64
          update: true
          install: >-
            autotools base-devel perl
            mingw-w64-x86_64-clang mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils
            mingw-w64-x86_64-python mingw-w64-x86_64-pkgconf mingw-w64-x86_64-libtool mingw-w64-x86_64-curl mingw-w64-x86_64-libsystre
      - name: Build selected prerequisites
        run: /mingw64/bin/python scripts/prepare-v3-package-ci.py --output package-evidence/prerequisites
      - name: Bootstrap
        run: ./bootstrap
      - name: Installed matrix (native Python; IOCP and WSAPoll)
        run: >-
          /mingw64/bin/python scripts/check-v3-installed-consumer.py --output package-evidence/matrix
          --provider-prefix "$(cygpath -m "$PWD/package-evidence/prerequisites/provider")" --toolchain-prefix "$(cygpath -m /mingw64)"
          --compiler clang++ --cc clang --jobs 2
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-package-mingw64-${{ github.sha }}
          path: package-evidence
          if-no-files-found: error
  freebsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: freebsd_instance
        uses: vmactions/freebsd-vm@c9f815bc7aa0d34c9fdd0619b034a32d6ca7b57e
        with:
          release: '14.3'
          mem: 8192
          cpu: 2
          prepare: pkg install -y bash autoconf automake libtool pkgconf python311 gmake curl binutils perl5 llvm
          run: |
            python3.11 scripts/prepare-v3-package-ci.py --output package-evidence/prerequisites --make gmake
            ./bootstrap
            python3.11 scripts/check-v3-installed-consumer.py --output package-evidence/matrix \
              --provider-prefix "$PWD/package-evidence/prerequisites/provider" \
              --pkg-config-dir /usr/local/share/pkgconfig --compiler clang++ --cc clang --make gmake --jobs 2
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v3-package-freebsd-${{ github.sha }}
          path: package-evidence
          if-no-files-found: error
